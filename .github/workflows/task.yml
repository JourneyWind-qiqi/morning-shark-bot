name: 每日问候推送
on:
  schedule:
    # UTC 23:00 = 北京时间早上 07:00 早安推送
    - cron: '0 23 * * *'
    # UTC 04:30 = 北京时间中午 12:30 午安推送
    - cron: '30 4 * * *'
    # UTC 15:00 = 北京时间晚上 23:00 晚安推送
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  push-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - env:
          SHARK_BASE_URLS: ${{ secrets.SHARK_BASE_URLS }}
          WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
        run: python morning_push.py
