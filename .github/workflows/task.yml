name: 每日问候推送
on:
  schedule:
    # UTC 3/13/22时03分 → 北京时间11:03、21:03、次日06:03
    - cron: '3 3,13,22 * * *'
  workflow_dispatch:
jobs:
  push-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pytz
      - env:
          SHARK_BASE_URLS: ${{ secrets.SHARK_BASE_URLS }}
          WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
        run: python morning_push.py
