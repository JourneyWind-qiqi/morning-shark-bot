name: 每日问候推送
on:
  schedule:
    # UTC 22:00 = 北京时间 06:00 早安推送
    - cron: '3 22 * * *'
    # UTC 03:00 = 北京时间 11:00 午安推送
    - cron: '3 3 * * *'
    # UTC 14:30 = 北京时间 22:30 晚安推送
    - cron: '39 14 * * *'
  workflow_dispatch:
jobs:
  push-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pytz
      - env:
          SHARK_BASE_URLS: ${{ secrets.SHARK_BASE_URLS }}
          WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
        run: python morning_push.py
